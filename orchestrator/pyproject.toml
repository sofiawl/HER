[project]
name = "her-orchestrator"
version = "0.1.0"
description = "HER terminal orchestrator: ask-her routes, grilling settles decisions, agents run the pipeline."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
her = "her.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["her"]

[project]
name = "her-orchestrator"
version = "0.1.0"
description = "HER in-chat orchestrator: the chat controls, grilling settles decisions, fresh subagents run and review each step."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
her = "her.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["her"]
